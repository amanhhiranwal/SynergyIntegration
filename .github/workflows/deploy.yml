name: Deploy to AWS Amplify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to AWS Amplify
        run: |
          cd dist
          zip -q -r /tmp/deploy.zip .
          echo "Created deployment package."

          DEPLOY_OUTPUT=$(aws amplify create-deployment --app-id ${{ secrets.AMPLIFY_APP_ID }} --branch-name main --region ${{ secrets.AWS_REGION }})
          JOB_ID=$(echo "$DEPLOY_OUTPUT" | jq -r '.jobId')
          UPLOAD_URL=$(echo "$DEPLOY_OUTPUT" | jq -r '.zipUploadUrl')

          echo "Uploading build to AWS Amplify (Job ID: $JOB_ID)..."
          curl -s -S -T /tmp/deploy.zip "$UPLOAD_URL"

          echo "Triggering deployment..."
          aws amplify start-deployment --app-id ${{ secrets.AMPLIFY_APP_ID }} --branch-name main --job-id "$JOB_ID" --region ${{ secrets.AWS_REGION }}

          echo "Deployment successfully triggered on AWS Amplify!"
